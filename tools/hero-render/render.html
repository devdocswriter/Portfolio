<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}</style>
</head><body>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';

const SIZE = 800;
await document.fonts.load('800 64px Inter');
await document.fonts.load('500 64px Inter');
await document.fonts.load('500 64px "JetBrains Mono"');

// deterministic RNG
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 19);
const world = new THREE.Group(); scene.add(world);

/* ---------- glyph textures ---------- */
const texCache = new Map();
const FONTS = { h: '800 104px Inter', b: '500 84px Inter', c: '500 84px "JetBrains Mono"' };
const measure = document.createElement('canvas').getContext('2d');
function glyph(ch, kind) {
  const key = kind + ch;
  if (texCache.has(key)) return texCache.get(key);
  measure.font = FONTS[kind];
  const w = Math.max(8, Math.ceil(measure.measureText(ch).width)) + 24;
  const h = 150;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.font = FONTS[kind]; g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.textAlign = 'center';
  g.fillText(ch, w / 2, h / 2 + 4);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const adv = measure.measureText(ch).width;
  const out = { tex, w, h, adv };
  texCache.set(key, out); return out;
}

/* ---------- final document layout ---------- */
const PAGE_W = 8.4, PAGE_H = 7.6;
const LINES = [
  { t: 'Send a message', k: 'h', s: 0.0062, col: '#f5f5f7', gap: 1.05 },
  { t: 'POST  /v1/messages', k: 'c', s: 0.0042, col: '#7dd3fc', gap: 0.95, pill: true },
  { t: 'Authenticate with OAuth 2.0, then', k: 'b', s: 0.0044, col: '#c7c7cc', gap: 0.56 },
  { t: 'send a JSON body to the endpoint.', k: 'b', s: 0.0044, col: '#c7c7cc', gap: 0.95 },
  { t: '{ "to": "user", "text": "Hi" }', k: 'c', s: 0.0040, col: '#ff9ac1', gap: 0.95, pill: true },
  { t: '200 OK  ·  delivered', k: 'c', s: 0.0040, col: '#4ade80', gap: 0.6 },
];
const tiles = [];
const PALETTE = ['#2997ff', '#a970ff', '#ff6b9a', '#7dd3fc', '#f5f5f7', '#c084fc'];
let y = PAGE_H / 2 - 1.55;
const left = -PAGE_W / 2 + 0.6;
const pills = [];
for (const L of LINES) {
  let x = left;
  if (L.pill) pills.push({ y, w: 0, s: L.s, x0: left });
  for (const ch of L.t) {
    const g = glyph(ch, L.k);
    const adv = g.adv * L.s;
    if (ch !== ' ') {
      const geo = new THREE.PlaneGeometry(g.w * L.s, g.h * L.s);
      const mat = new THREE.MeshBasicMaterial({ map: g.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
      const m = new THREE.Mesh(geo, mat); world.add(m);
      const r = 2.0 + rnd() * 2.9, th = rnd() * Math.PI * 2, ph = (rnd() - 0.5) * Math.PI;
      tiles.push({
        m, mat,
        end: new THREE.Vector3(x + adv / 2, y, 0.02),
        start: new THREE.Vector3(Math.cos(th) * Math.cos(ph) * r * 1.15 - 0.3, Math.sin(ph) * r * 0.8, Math.sin(th) * Math.cos(ph) * r),
        rs: new THREE.Euler((rnd() - .5) * 5, (rnd() - .5) * 5, (rnd() - .5) * 5),
        c0: new THREE.Color(PALETTE[Math.floor(rnd() * PALETTE.length)]),
        c1: new THREE.Color(L.col),
        sc0: 1.4 + rnd() * 1.4,
        delay: ((x - left) / PAGE_W) * 0.22 + (LINES.indexOf(L) / LINES.length) * 0.2 + rnd() * 0.05,
        decoy: false,
      });
    }
    x += adv;
  }
  if (L.pill) pills[pills.length - 1].w = x - left;
  y -= L.gap;
}

/* ---------- decoy code glyphs (only in the chaos state) ---------- */
const DECOY = '{}[]()<>/;=:#$&*|!?_'.split('');
for (let i = 0; i < 140; i++) {
  const ch = DECOY[Math.floor(rnd() * DECOY.length)];
  const g = glyph(ch, 'c'); const s = 0.004 + rnd() * 0.004;
  const geo = new THREE.PlaneGeometry(g.w * s, g.h * s);
  const mat = new THREE.MeshBasicMaterial({ map: g.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
  const m = new THREE.Mesh(geo, mat); world.add(m);
  const r = 1.6 + rnd() * 3.6, th = rnd() * Math.PI * 2, ph = (rnd() - 0.5) * Math.PI;
  const start = new THREE.Vector3(Math.cos(th) * Math.cos(ph) * r * 1.25 - 0.4, Math.sin(ph) * r * 0.85, Math.sin(th) * Math.cos(ph) * r);
  tiles.push({ m, mat, start, end: start.clone().multiplyScalar(0.25), rs: new THREE.Euler((rnd() - .5) * 5, (rnd() - .5) * 5, (rnd() - .5) * 5),
    c0: new THREE.Color(PALETTE[Math.floor(rnd() * PALETTE.length)]), c1: new THREE.Color('#2997ff'), sc0: 1, delay: rnd() * 0.25, decoy: true });
}

/* ---------- page panel ---------- */
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
const PX = 140;
const pc = document.createElement('canvas'); pc.width = PAGE_W * PX; pc.height = PAGE_H * PX;
const pg = pc.getContext('2d');
const grd = pg.createLinearGradient(0, 0, pc.width, pc.height); grd.addColorStop(0, '#26262c'); grd.addColorStop(1, '#141418');
roundRect(pg, 4, 4, pc.width - 8, pc.height - 8, 46); pg.fillStyle = grd; pg.fill();
pg.lineWidth = 4; pg.strokeStyle = 'rgba(255,255,255,0.16)'; pg.stroke();
pg.fillStyle = 'rgba(255,255,255,0.08)'; pg.fillRect(4, 118, pc.width - 8, 3);
['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { pg.beginPath(); pg.arc(64 + i * 44, 62, 13, 0, 7); pg.fillStyle = c; pg.fill(); });
pg.font = '500 34px "JetBrains Mono"'; pg.fillStyle = '#86868b'; pg.fillText('docs/messages.md', 220, 74);
// pill backgrounds behind code lines
for (const p of pills) {
  const top = (PAGE_H / 2 - p.y) * PX - 46, w = (p.w + 0.36) * PX;
  roundRect(pg, (p.x0 + PAGE_W / 2 - 0.18) * PX, top, w, 92, 20);
  pg.fillStyle = 'rgba(0,0,0,0.45)'; pg.fill(); pg.strokeStyle = 'rgba(255,255,255,0.08)'; pg.lineWidth = 2; pg.stroke();
}
// accent rule beside heading
pg.fillStyle = '#2997ff'; roundRect(pg, 40, (PAGE_H / 2 - (PAGE_H / 2 - 1.55)) * PX - 50, 8, 100, 4); pg.fill();
const ptex = new THREE.CanvasTexture(pc); ptex.colorSpace = THREE.SRGBColorSpace; ptex.anisotropy = 8;
const pmat = new THREE.MeshBasicMaterial({ map: ptex, transparent: true, depthWrite: false });
const panel = new THREE.Mesh(new THREE.PlaneGeometry(PAGE_W, PAGE_H), pmat);
panel.position.z = -0.06; panel.renderOrder = -1; world.add(panel);

/* ---------- frame renderer ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (t) => (1 - Math.cos(Math.PI * t)) / 2;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const tmpC = new THREE.Color();

window.renderFrame = (T) => {
  // whole object turns as it resolves, like a head following the cursor
  world.rotation.y = THREE.MathUtils.lerp(0.75, -0.32, T);
  world.rotation.x = THREE.MathUtils.lerp(-0.25, 0.12, T);
  world.position.x = THREE.MathUtils.lerp(-0.2, 0.15, T);
  // panel
  const pT = smooth(0.42, 0.9, T);
  pmat.opacity = pT;
  panel.scale.setScalar(0.85 + 0.15 * pT);
  panel.position.z = -0.06 - (1 - pT) * 1.5;
  for (const t of tiles) {
    const k = ease(clamp((T - t.delay) / 0.52));
    t.m.position.lerpVectors(t.start, t.end, k);
    t.m.position.z += Math.sin(Math.PI * k) * 1.6;
    // slow drift in chaos so frames near 0 still move
    const drift = (1 - k) * T * 6;
    t.m.position.y += Math.sin(t.delay * 40 + drift) * 0.25 * (1 - k);
    t.m.rotation.set(t.rs.x * (1 - k) + drift * 0.6 * (1 - k), t.rs.y * (1 - k), t.rs.z * (1 - k));
    const sc = THREE.MathUtils.lerp(t.sc0, 1, k);
    t.m.scale.setScalar(t.decoy ? sc * (1 - k) : sc);
    tmpC.copy(t.c0).lerp(t.c1, k); t.mat.color.copy(tmpC);
    t.mat.opacity = t.decoy ? 0.9 * (1 - k) : 0.55 + 0.45 * smooth(0, 0.6, k) + 0.45 * (1 - k) * 0.2;
  }
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/webp', 0.7);
};
window.ready = true;
</script>
</body></html>
