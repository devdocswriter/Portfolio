<!doctype html>
<html><head><meta charset="utf-8">
<!-- Renders the "Code → Clarity" figure as a transparent WebP frame sequence.
     Usage: serve this folder, then `node run.js <out-dir> <frame-count>`. -->
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@600;800&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}</style>
</head><body>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';

const SIZE = 800;
await Promise.all([
  document.fonts.load('800 64px "Shantell Sans"'),
  document.fonts.load('400 64px "IBM Plex Sans"'),
  document.fonts.load('500 64px "IBM Plex Mono"'),
]);
// Pen marks use Shantell Sans at full informality + bounce (same family, handwritten register).
// Canvas can't set font-variation-settings, so load a pinned instance under its own name.
{
  const css = await (await fetch('https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,BNCE,INFM@600,60,100&display=swap')).text();
  const blocks = css.split('@font-face').filter((b) => b.includes('U+0000-00FF'));
  const url = (blocks[0] || css).match(/url\(([^)]+)\)/)[1];
  const face = new FontFace('Shantell Pen', `url(${url})`, { weight: '600' });
  document.fonts.add(await face.load());
}

// deterministic RNG so every render is identical
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(SIZE, SIZE);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 19);
const world = new THREE.Group(); scene.add(world);

/* ---------- ink palette (matches the site's paper theme) ---------- */
const INK = '#2a2420', INK_SOFT = '#4a423b', RED = '#c2412d', GREEN = '#3b7a4b', PENCIL = '#6b6660';

/* ---------- glyph textures ---------- */
const texCache = new Map();
const FONTS = { h: '800 104px "Shantell Sans"', b: '400 84px "IBM Plex Sans"', c: '500 80px "IBM Plex Mono"', s: '600 96px "Shantell Pen"' };
const measure = document.createElement('canvas').getContext('2d');
function glyph(ch, kind) {
  const key = kind + ch;
  if (texCache.has(key)) return texCache.get(key);
  measure.font = FONTS[kind];
  const w = Math.max(8, Math.ceil(measure.measureText(ch).width)) + 24;
  const h = 150;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.font = FONTS[kind]; g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.textAlign = 'center';
  g.fillText(ch, w / 2, h / 2 + 4);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const out = { tex, w, h, adv: measure.measureText(ch).width };
  texCache.set(key, out); return out;
}

/* ---------- final document layout ---------- */
const PAGE_W = 8.4, PAGE_H = 7.6;
const LINES = [
  { t: 'Send a message', k: 'h', s: 0.0060, col: INK, gap: 1.05 },
  { t: 'POST  /v1/messages', k: 'c', s: 0.0042, col: INK_SOFT, gap: 0.95, pill: true },
  { t: 'Authenticate with OAuth 2.0, then', k: 'b', s: 0.0045, col: INK_SOFT, gap: 0.56 },
  { t: 'send a JSON body to the endpoint.', k: 'b', s: 0.0045, col: INK_SOFT, gap: 0.95 },
  { t: '{ "to": "user", "text": "Hi" }', k: 'c', s: 0.0040, col: INK_SOFT, gap: 0.95, pill: true },
  { t: '200 OK  ·  delivered', k: 'c', s: 0.0040, col: GREEN, gap: 0.6 },
];
const tiles = [];
const PALETTE = [INK, INK, INK, PENCIL, PENCIL, RED];
let y = PAGE_H / 2 - 1.55;
const left = -PAGE_W / 2 + 0.75;
const pills = [];
for (const L of LINES) {
  let x = left;
  if (L.pill) pills.push({ y, w: 0, x0: left });
  for (const ch of L.t) {
    const g = glyph(ch, L.k);
    const adv = g.adv * L.s;
    if (ch !== ' ') {
      // in the "code" state a share of letters are scribbled in pen (Shantell Pen)
      const loose = rnd() < 0.35 ? glyph(ch, 's') : g;
      const geo = new THREE.PlaneGeometry(g.w * L.s, g.h * L.s);
      const mat = new THREE.MeshBasicMaterial({ map: g.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
      const m = new THREE.Mesh(geo, mat); world.add(m);
      const r = 2.0 + rnd() * 2.9, th = rnd() * Math.PI * 2, ph = (rnd() - 0.5) * Math.PI;
      tiles.push({
        m, mat, tex: g.tex, looseTex: loose.tex,
        end: new THREE.Vector3(x + adv / 2, y, 0.02),
        start: new THREE.Vector3(Math.cos(th) * Math.cos(ph) * r * 1.15 - 0.3, Math.sin(ph) * r * 0.8, Math.sin(th) * Math.cos(ph) * r),
        rs: new THREE.Euler((rnd() - .5) * 5, (rnd() - .5) * 5, (rnd() - .5) * 5),
        c0: new THREE.Color(PALETTE[Math.floor(rnd() * PALETTE.length)]),
        c1: new THREE.Color(L.col),
        sc0: 1.4 + rnd() * 1.4,
        delay: ((x - left) / PAGE_W) * 0.22 + (LINES.indexOf(L) / LINES.length) * 0.2 + rnd() * 0.05,
        decoy: false,
      });
    }
    x += adv;
  }
  if (L.pill) pills[pills.length - 1].w = x - left;
  y -= L.gap;
}

/* ---------- decoy code glyphs (only in the chaos state) ---------- */
const DECOY = '{}[]()<>/;=:#$&*|!?_'.split('');
for (let i = 0; i < 140; i++) {
  const ch = DECOY[Math.floor(rnd() * DECOY.length)];
  const g = glyph(ch, rnd() < 0.5 ? 'c' : 's'); const s = 0.004 + rnd() * 0.004;
  const geo = new THREE.PlaneGeometry(g.w * s, g.h * s);
  const mat = new THREE.MeshBasicMaterial({ map: g.tex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
  const m = new THREE.Mesh(geo, mat); world.add(m);
  const r = 1.6 + rnd() * 3.6, th = rnd() * Math.PI * 2, ph = (rnd() - 0.5) * Math.PI;
  const start = new THREE.Vector3(Math.cos(th) * Math.cos(ph) * r * 1.25 - 0.4, Math.sin(ph) * r * 0.85, Math.sin(th) * Math.cos(ph) * r);
  tiles.push({ m, mat, start, end: start.clone().multiplyScalar(0.25), rs: new THREE.Euler((rnd() - .5) * 5, (rnd() - .5) * 5, (rnd() - .5) * 5),
    c0: new THREE.Color(PALETTE[Math.floor(rnd() * PALETTE.length)]), c1: new THREE.Color(PENCIL), sc0: 1, delay: rnd() * 0.25, decoy: true });
}

/* ---------- the sheet of paper ---------- */
const PX = 140, PAD = 40;
const pc = document.createElement('canvas'); pc.width = PAGE_W * PX + PAD * 2; pc.height = PAGE_H * PX + PAD * 2;
const pg = pc.getContext('2d');
const W = PAGE_W * PX, H = PAGE_H * PX;
pg.save();
pg.shadowColor = 'rgba(58,44,30,0.28)'; pg.shadowBlur = 30; pg.shadowOffsetY = 12;
pg.fillStyle = '#fbf8f1'; pg.fillRect(PAD, PAD, W, H);
pg.restore();
// paper grain
for (let i = 0; i < 9000; i++) { pg.fillStyle = `rgba(90,70,40,${rnd() * 0.05})`; pg.fillRect(PAD + rnd() * W, PAD + rnd() * H, 2, 2); }
// ruled lines + red margin
pg.strokeStyle = 'rgba(143,176,212,0.55)'; pg.lineWidth = 2;
for (let ly = 170; ly < H - 20; ly += 64) { pg.beginPath(); pg.moveTo(PAD, PAD + ly); pg.lineTo(PAD + W, PAD + ly); pg.stroke(); }
pg.strokeStyle = 'rgba(217,119,106,0.7)'; pg.beginPath(); pg.moveTo(PAD + 70, PAD); pg.lineTo(PAD + 70, PAD + H); pg.stroke();
// file name, written in pencil
pg.font = '500 32px "IBM Plex Mono"'; pg.fillStyle = PENCIL; pg.fillText('docs/messages.md', PAD + 100, PAD + 70);
// "REVIEWED" stamp
pg.save(); pg.translate(PAD + W - 210, PAD + 72); pg.rotate(-0.12);
pg.strokeStyle = 'rgba(59,122,75,0.85)'; pg.lineWidth = 5; pg.strokeRect(-130, -36, 260, 72);
pg.font = '800 40px "Shantell Sans"'; pg.fillStyle = 'rgba(59,122,75,0.85)'; pg.textAlign = 'center'; pg.textBaseline = 'middle'; pg.fillText('REVIEWED', 0, 3);
pg.restore();
// code pills: light paper chips with a pencil outline
for (const p of pills) {
  const top = PAD + (PAGE_H / 2 - p.y) * PX - 44, x0 = PAD + (p.x0 + PAGE_W / 2 - 0.18) * PX, w = (p.w + 0.36) * PX;
  pg.fillStyle = 'rgba(236,230,218,0.95)'; pg.fillRect(x0, top, w, 88);
  pg.strokeStyle = 'rgba(142,136,127,0.9)'; pg.lineWidth = 3; pg.strokeRect(x0, top, w, 88);
}
const ptex = new THREE.CanvasTexture(pc); ptex.colorSpace = THREE.SRGBColorSpace; ptex.anisotropy = 8;
const pmat = new THREE.MeshBasicMaterial({ map: ptex, transparent: true, depthWrite: false });
const panel = new THREE.Mesh(new THREE.PlaneGeometry(PAGE_W * pc.width / W, PAGE_H * pc.height / H), pmat);
panel.position.z = -0.06; panel.renderOrder = -1; world.add(panel);

/* ---------- frame renderer ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (t) => (1 - Math.cos(Math.PI * t)) / 2;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
const tmpC = new THREE.Color();

window.renderFrame = (T) => {
  world.rotation.y = THREE.MathUtils.lerp(0.75, -0.26, T);
  world.rotation.x = THREE.MathUtils.lerp(-0.25, 0.1, T);
  world.rotation.z = THREE.MathUtils.lerp(0.08, -0.03, T);
  world.position.x = THREE.MathUtils.lerp(-0.2, 0.1, T);
  const pT = smooth(0.42, 0.9, T);
  pmat.opacity = pT;
  panel.scale.setScalar(0.85 + 0.15 * pT);
  panel.position.z = -0.06 - (1 - pT) * 1.5;
  for (const t of tiles) {
    const k = ease(clamp((T - t.delay) / 0.52));
    t.m.position.lerpVectors(t.start, t.end, k);
    t.m.position.z += Math.sin(Math.PI * k) * 1.6;
    const drift = (1 - k) * T * 6;
    t.m.position.y += Math.sin(t.delay * 40 + drift) * 0.25 * (1 - k);
    t.m.rotation.set(t.rs.x * (1 - k) + drift * 0.6 * (1 - k), t.rs.y * (1 - k), t.rs.z * (1 - k));
    const sc = THREE.MathUtils.lerp(t.sc0, 1, k);
    t.m.scale.setScalar(t.decoy ? sc * (1 - k) : sc);
    if (!t.decoy) t.mat.map = k < 0.55 ? t.looseTex : t.tex;   // scribble → typeset
    tmpC.copy(t.c0).lerp(t.c1, k); t.mat.color.copy(tmpC);
    t.mat.opacity = t.decoy ? 0.85 * (1 - k) : 0.75 + 0.25 * smooth(0, 0.6, k);
  }
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/webp', 0.72);
};
window.ready = true;
</script>
</body></html>
